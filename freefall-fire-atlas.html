  { id: "f02", inv: "saffire13", kind: "flight", tags: ["scale", "materials", "flow"], src: ["20170008805"], text: "A thin charring fabric (fiberglass-cotton, 94 × 40.6 cm) burned in 20 cm/s average forced air. Earlier microgravity samples were at most about 15 cm long." },
  { id: "f03", inv: "saffire13", kind: "flight", tags: ["spread", "scale"], src: ["20180005168"], text: "Saffire data resolved whether flame growth reaches a steady size, and showed that enclosure size affected flame spread more than expected." },
  { id: "f04", inv: "saffire13", kind: "flight", tags: ["spread", "atmosphere", "gravity", "materials", "flow"], src: ["20200000557"], text: "On Saffire II, 10 mm PMMA burned at 100 kPa and 200 mm/s. In normal gravity at 200 mm/s, lowering pressure from 100 to 40 kPa slowed flame spread toward the microgravity rate." },
  { id: "f05", inv: "saffire13", kind: "ground", tags: ["materials", "ignition", "gravity"], src: ["20150022421"], text: "Ground tests of 5 × 30 cm silicone samples in four thicknesses (0.25, 0.36, 0.61 and 1.00 mm): the two thinnest burned completely when horizontal and at angles up to 75 degrees; the thickest could not be ignited." },
  { id: "f06", inv: "saffire45", kind: "flight", tags: ["scale", "heat", "materials", "gases"], src: ["20210011521"], text: "Saffire IV and V samples were all 40 cm wide: PMMA 18 cm long, cotton and cotton/fiberglass fabrics 50 cm long. Heat release reached up to 10 kW, yet average vehicle conditions stayed at acceptable levels." },
  { id: "f07", inv: "saffire45", kind: "flight", tags: ["heat", "materials", "flow", "invisible"], src: ["20220012861"], text: "Two-colour pyrometry gave an average flame temperature of about 1300 K (error under 117 K) for cotton/fiberglass fabric in 20 cm/s concurrent flow on Saffire IV." },
  { id: "f08", inv: "saffire45", kind: "model", tags: ["scale", "heat", "gases"], src: ["20220002714"], text: "A PyroSim model of the Cygnus vehicle for Saffire IV estimates heat release from temperature sensors near the payload and compares simulated gas species with measurements." },
  { id: "f09", inv: "saffire45", kind: "flight", tags: ["gases", "smoke"], src: ["20210017343"], text: "A dedicated evaluation of combustion products from Saffire IV and V exists. Its record has no abstract, so no numbers from it are used here." },
  { id: "f10", inv: "saffire6", kind: "flight", tags: ["gases", "smoke", "atmosphere", "detection", "heat"], src: ["20260001992"], text: "Seven long-duration low-gravity tests aboard Cygnus varied atmospheric pressure and oxygen concentration (samples 40 cm wide). Pressure rise and temperature change were small, but particulate smoke and gaseous products reached substantial or hazardous levels." },
  { id: "f11", inv: "saffire6", kind: "flight", tags: ["gases", "heat", "materials", "scale", "detection"], src: ["20240002981"], text: "Saffire VI tests spanned 1.5 to 3.2 kW in free air volumes of 17 to 19 m³, using cotton/fiberglass (50 cm), 1 cm PMMA (18 cm, two-sided spread), 0.5 cm PMMA (18 cm, one-sided spread) and Nomex (7 cm), about 41 cm wide. Temperature and pressure rise mattered less than the increase in CO₂ and CO." },
  { id: "f12", inv: "bass", kind: "flight", tags: ["atmosphere", "flow", "materials"], src: ["20210011385"], text: "BASS-II used gaseous N₂ to dilute the ISS working volume for the first time. Main variables: ambient O₂, ventilation flow velocity, and fuel type, thickness and geometry." },
  { id: "f13", inv: "bass", kind: "flight", tags: ["heat", "gases"], src: ["20210011385", "20150019858"], text: "Heat release was computed from O₂ consumption using 13.1 kJ per gram of O₂. Most tests stayed well below 100 W. The global equivalence ratio averaged 1.3, which is fuel rich. On-board O₂, CO and CO₂ readings were used to judge how complete the burning was." },
  { id: "f14", inv: "bass", kind: "flight", tags: ["flow", "invisible", "spread"], src: ["20140011099", "20160000593"], text: "Flames at flow speeds below 1 cm/s became dim blue and stable. Flows of about 1 to 5 cm/s raised fuel temperature and brightened the flame. The smallest acrylic slabs still burned for over 5 minutes before self-extinguishing." },
  { id: "f15", inv: "bass", kind: "flight", tags: ["materials", "flow", "scale"], src: ["20160000593"], text: "More than one hundred tests were run across BASS-I and BASS-II, on thin and thick flat samples, acrylic slabs, spheres and cylinders in a wind tunnel with flow up to 53 cm/s." },
  { id: "f16", inv: "bass", kind: "ground", tags: ["flow", "atmosphere", "materials", "gravity", "suppression"], src: ["20170006615", "20160012691"], text: "Normal-gravity blowoff limits for PMMA rods (0.635 to 3.81 cm diameter) at 14 to 18% O₂ follow a linear boundary between oxygen concentration and flow speed. They were measured for comparison with BASS-II." },
  { id: "f17", inv: "bass", kind: "flight", tags: ["flow", "atmosphere", "suppression", "materials", "ignition"], src: ["20150008961"], text: "Twenty-four concurrent-flow PMMA rod tests ran on the ISS, with oxygen set by diluting the working volume with N₂. Blowoff and quenching limits were measured at several oxygen levels, and 5.18 s drop-tower tests compared short and long durations." },
  { id: "f18", inv: "flex", kind: "plan", tags: ["suppression", "atmosphere", "moon", "mars"], src: ["20090014812"], text: "MDCA-FLEX assesses fire suppressant effectiveness in microgravity and examines how candidate crew exploration atmospheres affect suppression. The goal is to guide large-scale suppression tests and pick a suppressant for next-generation crew vehicles." },
  { id: "f19", inv: "flex", kind: "flight", tags: ["suppression", "scale"], src: ["20150023456"], text: "The first FLEX report covers 284 droplet tests (March 2009 to December 2011) on the ISS, with hardware, diagnostics, procedures and analysis methods." },
  { id: "f20", inv: "flex", kind: "flight", tags: ["suppression", "atmosphere", "gases"], src: ["20110020695"], text: "Methanol droplets of 1.25 to 1.72 mm in still microgravity air at 1 atm and 21% O₂: larger starting droplets went out at larger diameters, and more ambient CO₂ gave only a slight decrease in extinction diameter." },
  { id: "f21", inv: "flex2", kind: "flight", tags: ["invisible", "suppression"], src: ["20160000344"], text: "Droplets of n-decane, n-heptane and n-octane can sustain cool-flame burning without any visible flame." },
  { id: "f22", inv: "flex2", kind: "flight", tags: ["suppression", "atmosphere", "invisible"], src: ["20205008449"], text: "Replacing part of the N₂ with helium drastically increased the cool-flame extinction diameter of n-heptane, n-octane, n-decane and n-dodecane droplets. CO₂ and xenon were also tested as inert gases." },
  { id: "f23", inv: "flex2", kind: "model", tags: ["invisible", "heat", "suppression"], src: ["20150018397"], text: "Computation for n-heptane (1 cm/s fuel injection): in near-still air (2 mm/s or less) the diffusion flame goes out near 1200 K from radiative loss, then moves into a cool flame near 700 K, with a flash re-ignition after about 18 s." },
  { id: "f24", inv: "flex2", kind: "flight", tags: ["atmosphere", "heat", "gases"], src: ["20260002014"], text: "In microgravity spherical diffusion flames from 0.5 to 10 atm, H₂O contributes more than CO₂ to radiative loss at higher pressures because of reabsorption." },
  { id: "f25", inv: "same", kind: "flight", tags: ["smoke", "detection", "materials", "flow"], src: ["20130000422"], text: "SAME-2 heated five spacecraft-representative materials (Teflon, Kapton, cotton, silicone rubber, Pyrell) below ignition. Airflow ranged from still to 8 cm/s and aging from 11 to 1800 s. Most average particle sizes fell between 200 and 400 nm; some still cases made much larger particles." },
  { id: "f26", inv: "same", kind: "flight", tags: ["detection", "smoke", "gravity"], src: ["20070031686"], text: "Spacecraft smoke detectors were designed from normal-gravity data because microgravity smoke data was lacking. The DAFT precursor found ISS cabin particulate levels substantially below Space Shuttle and typical ground levels." },
  { id: "f27", inv: "same", kind: "flight", tags: ["detection", "smoke", "materials"], src: ["20170007283"], text: "Pyrolysis products, not soot, are the primary early-detection target in the SAME, WSTF and GASP aerosol work." },
  { id: "f28", inv: "same", kind: "flight", tags: ["detection", "smoke"], src: ["20050215648"], text: "The P-Trak condensation nuclei counter, a key SAME diagnostic, can count single particles as small as 20 nm in an aerosol stream." },
  { id: "f29", inv: "acme", kind: "flight", tags: ["smoke", "atmosphere", "scale"], src: ["20220015583"], text: "From November 2017 to February 2022, six laminar non-premixed gaseous-fuel flame investigations ran on the ISS, including coflow burner studies of high-sooting and high-dilution flames and electric-field tests up to 10 kV of either polarity." },
  { id: "f30", inv: "acme", kind: "flight", tags: ["atmosphere", "suppression", "smoke"], src: ["20210015913"], text: "More than a thousand flames were ignited from September 2017. Goals include flame stability and extinction limits, soot reduction and oxygen-enriched combustion." },
  { id: "f31", inv: "acme", kind: "flight", tags: ["scale", "materials"], src: ["20250001364"], text: "ISS Combustion Integrated Rack research reached 14 independent experiments, covering droplet and gaseous-fuel flames and PMMA flammability." },
  { id: "f32", inv: "slice", kind: "flight", tags: ["atmosphere", "flow", "gravity"], src: ["20150002322"], text: "Nitrogen-diluted methane/air coflow flames (CH₄ mole fraction 0.4 to 1.0, inlet velocity 23 to 90 cm/s) were measured and modelled in microgravity and normal gravity." },
  { id: "f33", inv: "slice", kind: "flight", tags: ["smoke", "heat", "gravity"], src: ["20140017780"], text: "Sooting methane coflow flames in microgravity had lower soot temperatures and higher soot volume fraction than in normal gravity." },
  { id: "f34", inv: "spice", kind: "plan", tags: ["smoke", "flow"], src: ["20090014827"], text: "SPICE aims to measure laminar smoke-point properties of nonbuoyant jet flames for several fuels across nozzle diameters and coflow velocities. The record reports no results." },
  { id: "f35", inv: "spice", kind: "flight", tags: ["smoke", "atmosphere", "moon"], src: ["20030016530", "20000056909"], text: "Shuttle-era on-orbit smoke-point tests (ethylene and propane, 35 to 130 kPa, exit velocities 170 to 690 mm/s) found smoke-point flame lengths of 15 to 63 mm. They were up to 2.3 times shorter than earlier ground-based microgravity flames and up to 6.4 times shorter than buoyant flames, and scaled roughly inversely with pressure." },
  { id: "c01", inv: "context", kind: "context", tags: ["moon", "mars", "atmosphere"], src: ["20240003211"], text: "Exploration atmospheres: Apollo 5 psia at 100% O₂, Skylab 5 psia at 70 to 74% O₂, Shuttle 10.2 psia at 26.5% O₂, and the lunar-surface recommendation 8.2 psia at 34% O₂, with a 4.3 psid suit." },
  { id: "c02", inv: "context", kind: "ground", tags: ["ignition", "atmosphere", "materials", "moon"], src: ["20080013149"], text: "Piloted ignition of PMMA in 52.7 to 58.6 kPa and 30 to 34% O₂ (normal gravity): lowering pressure to 58.6 kPa at 21% O₂ cut ignition time by 17% on average, and adding oxygen (32%) cut it by another 10%." },
  { id: "c03", inv: "context", kind: "ground", tags: ["ignition", "atmosphere", "materials", "moon"], src: ["20110011524"], text: "The minimum ignition delay observed in normoxic-equivalent environments (about 58.6 kPa and 32% O₂) was nearly 30% lower." },
  { id: "c04", inv: "context", kind: "ground", tags: ["moon", "gravity", "materials", "atmosphere"], src: ["20240008623"], text: "A 2024 poster, Flammability of Materials on the Moon, describes burning SIBAL fabric in normal air and PMMA in the Space Exploration Atmospheres. Its abstract reports no results." },
  { id: "c05", inv: "context", kind: "ground", tags: ["moon", "mars", "gravity", "flow"], src: ["20010074096"], text: "A normal-gravity low-stretch apparatus uses forced airflow to approximate flammability at lunar or Martian gravity (2001)." },
  { id: "c06", inv: "context", kind: "context", tags: ["moon", "atmosphere"], src: ["20260003925"], text: "Reduced-pressure cabins affect life support: nine subsystems are viable at 10.2 psia but only three at 8.2 psia, and about 70% of assessed subsystems would need material replacements at 8.2 psia." }
];

// Extra findings beyond the 38 NTRS findings (ntrs.js). kind: flight | ground | model | plan | context | data
const FINDINGS2 = [
  { id: "p01", psi: ["PSI-20"], kind: "flight", tags: ["suppression", "atmosphere", "moon", "materials", "flow"], src: ["psi:PSI-20"], text: "In BRE, quasi-steady burning like that of PMMA and nylon was seen in microgravity with no airflow at all, mainly in the elevated-oxygen atmospheres planned for future spacecraft. In 21% O₂ the same flames self-extinguished in a short time. Stopping ventilation is an established step in putting out spacecraft fires." },
  { id: "p02", psi: ["PSI-20"], kind: "plan", tags: ["atmosphere", "moon", "materials"], src: ["psi:PSI-20"], text: "BRE examined the three NASA-considered atmospheres: 14.7 psia with 21% O₂, 10.2 psia with 26.5% O₂, and 8.2 psia with 34% O₂." },
  { id: "p03", psi: ["PSI-68"], kind: "flight", tags: ["atmosphere", "suppression"], src: ["psi:PSI-68"], text: "FLEX-2 filled the chamber at 0.5 to 3.0 atm with 10 to 40% O₂ (mole fraction 0.1 to 0.4), with a diluent for the balance." },
  { id: "p04", psi: ["PSI-69"], kind: "flight", tags: ["suppression", "gases"], src: ["psi:PSI-69"], text: "FLEX measured how well gaseous suppressants such as CO₂, helium and SF₆ work in microgravity, with limiting-oxygen tests at 0.5 to 1.5 atm." },
  { id: "p05", psi: ["PSI-159"], kind: "flight", tags: ["atmosphere", "invisible"], src: ["brief", "psi:PSI-159"], text: "The highest oxygen levels tested in microgravity were in ACME CFI-G: an oxygen-nitrogen mix of up to 85% O₂ flowed from a spherical burner into a fuel-filled chamber, making inside-out flames." },
  { id: "p06", psi: ["PSI-26", "PSI-25"], kind: "flight", tags: ["materials", "gravity", "suppression"], src: ["psi:PSI-26"], text: "NASA material selection uses NASA-STD-6001 Test 1, which sorts materials by their 1-g behaviour without low-gravity effects. BASS used nitrogen as a suppressant, a direct link to ISS extinguishing methods." },
  { id: "p07", psi: ["PSI-25"], kind: "flight", tags: ["atmosphere", "flow", "materials"], src: ["psi:PSI-25"], text: "BASS-II varied airflow up to 40 cm/s and lowered oxygen below 21% by adding nitrogen, on slabs, cylinders, spheres, films and fabric." },
  { id: "p08", psi: ["PSI-62"], kind: "model", tags: ["spread", "materials", "flow"], src: ["psi:PSI-62"], text: "A flamelet model tested against BASS images (rebuilt in 3D by two-colour tomography) aimed to reproduce the 'Goldilocks' flammability zone and predict limits for new spacecraft materials." },
  { id: "p09", psi: ["PSI-115"], kind: "model", tags: ["smoke", "detection", "gravity"], src: ["psi:PSI-115"], text: "Simulations of smoke from a heated source in a SAME-like duct showed buoyant and non-buoyant wakes collect and grow particles differently, which changes what a detector downstream sees." },
  { id: "p10", psi: ["PSI-60"], kind: "model", tags: ["smoke", "gravity"], src: ["psi:PSI-60"], text: "Over 1,600 raw SPICE images were analysed for soot temperature and soot volume fraction to explain the large gap between soot formation at 0 g and 1 g." },
  { id: "p11", psi: ["PSI-99"], kind: "flight", tags: ["materials", "scale", "flow"], src: ["psi:PSI-99"], text: "Saffire-II burned nine 5 × 29 cm samples (SIBAL, silicone, structural PMMA, flat PMMA, PMMA with Nomex) at 20 or 30 cm/s, concurrent or opposed." },
  { id: "p12", psi: ["PSI-22"], kind: "flight", tags: ["gravity", "moon", "mars"], src: ["brief", "psi:PSI-22"], text: "ACME E-FIELD applied up to 10 kV between burner and mesh. The challenge brief notes the field acting on flame ions can mimic partial gravity." },
  { id: "p13", psi: ["PSI-102"], kind: "flight", tags: ["smoke", "detection"], src: ["psi:PSI-102"], text: "SAME heated samples for 15 to 60 s (events about 2 minutes), tested two spacecraft smoke detectors and sized the particles with an electron microscope after flight." },
  { id: "p14", psi: ["PSI-47"], kind: "flight", tags: ["detection", "smoke"], src: ["psi:PSI-47"], text: "DAFT and DAFT-2 flew a P-Trak particle counter modified to recycle its alcohol by capillary action, and checked it against a DustTrak on the ISS using Arizona Red Dust as a standard. This is the instrument behind SAME's particle counts." },
  { id: "s01", psi: ["PSI-102"], kind: "ground", tags: ["detection", "smoke"], src: ["same-eird"], text: "Below about 0.2 µm, ionization detectors are more sensitive; for larger particles, light-scattering detectors are. Early ionization detectors were chosen for the Shuttle because incipient smoke was thought to be smaller than 1 µm." },
  { id: "s02", psi: ["PSI-102"], kind: "flight", tags: ["smoke", "detection", "gravity", "materials"], src: ["same-eird"], text: "In the earlier CSD flight test, low-g smoke particles were larger: Kapton primary particles 76 nm in low g vs 35 nm in 1 g, Teflon 136 vs 75 nm. The ISS detector did better on low-g Kapton smoke, while the Shuttle detector did worse on liquid smokes from paper and silicone rubber." },
  { id: "s03", psi: ["PSI-102"], kind: "ground", tags: ["detection", "gases", "materials"], src: ["same-eird"], text: "In ground tests of an advanced sensor suite, overheated Kapton at the SAME baseline produced only particles: no HC, CO, CO₂ or H₂ response. Teflon, cotton and silicone rubber triggered gas sensors." },
  { id: "d01", psi: ["PSI-102"], kind: "data", tags: ["smoke", "detection", "materials"], src: ["same-data"], text: "Our analysis of seven SAME-R flight runs (2010): peak particle count ranged from 5,390 to 215,000 per cm³ and peak DustTrak mass from 3.8 to 207 mg/m³. Count and mass ranked the runs differently: run 58 had the 3rd-highest count but the lowest mass." },
  { id: "m01", psi: [], kind: "flight", tags: ["moon", "gravity", "materials"], src: ["nasa-fm2"], text: "Modelling, parabolic flights and ISS experiments suggest materials may burn at lower oxygen in lunar gravity than on Earth, so some things that are not flammable on Earth may be flammable in a Moon habitat." },
  { id: "m02", psi: [], kind: "plan", tags: ["moon", "atmosphere", "gravity"], src: ["20240015307"], text: "FM2 will test samples on the Moon at 21% O₂ and 14.7 psia, and at 34% O₂ and 8.2 psia." },
  { id: "m03", psi: [], kind: "ground", tags: ["moon", "gravity"], src: ["20250010653"], text: "A spinning New Shepard rocket (11 RPM, 1.22 m effective radius) created lunar gravity. Two samples burned in air for over two and a half minutes, a step toward FM2." },
  { id: "m04", psi: [], kind: "ground", tags: ["moon", "gravity", "materials", "flow"], src: ["20250010975"], text: "Nomex HT-90 tests in a 5.2 s drop tower, flow tunnel and centrifuge showed clear differences between 1 g with flow, microgravity with flow, and lunar gravity without forced flow." },
  { id: "m05", psi: [], kind: "flight", tags: ["materials", "flow", "suppression", "atmosphere"], src: ["20240007628"], text: "SoFIE: 4 cm PMMA spheres on ISS in flows of 0.2 to 80 cm/s and 13 to 28% O₂ at 1 atm. Extinction came through pulsating flames; at about 0.4 cm/s, flame-tip pulsations lasted roughly 15 minutes." },
  { id: "m06", psi: [], kind: "context", tags: ["materials", "gravity"], src: ["nasa-sofie"], text: "NASA-STD-6001 uses a 1-g flame propagation test that some researchers believe is not conservative in low gravity." },
  { id: "m07", psi: [], kind: "plan", tags: ["materials", "gravity"], src: ["nasa-flare"], text: "FLARE aims to estimate microgravity flammability limits from ground data and propose a new screening method addressing shortcomings of NASA-STD-6001B." },
  { id: "h01", psi: [], kind: "context", tags: ["detection", "smoke", "suppression"], src: ["nasa-mir"], text: "Mir, 1997: a solid-fuel oxygen generator burst into flame, blocked the route to one Soyuz and filled modules with smoke. Life support took several hours to clear it. The likely cause was latex glove material inside the canister." },
  { id: "h02", psi: [], kind: "context", tags: ["atmosphere", "ignition"], src: ["nasa-apollo1"], text: "Apollo 1, 1967: in a pure-oxygen atmosphere the fire spread quickly. Investigators found evidence of arcing in wires near the environmental control system." },
  { id: "h03", psi: [], kind: "context", tags: ["ignition"], src: ["nasa-apollo13"], text: "After Apollo 13's oxygen tank explosion, the tank system was redesigned: a third tank in another bay, upgraded thermostats, no stirring fans, and all wiring sheathed in stainless steel." },
  { id: "h04", psi: [], kind: "context", tags: ["detection"], src: ["brief"], text: "During Artemis II a smoke alarm went off. The commander: “[If] you want to get somebody’s attention really quick, make the fire alarm go off in your spacecraft when you’re still about 80,000 miles from home.”" },
  { id: "e01", psi: [], kind: "context", tags: ["detection", "earth"], src: ["spinoff-detector"], text: "A detector first used in Space Shuttle orbiters tells combustion particles from dust, so it gives fewer false alarms, and it signals a fire condition before flame and smoke appear (Spinoff, 1978)." },
  { id: "e02", psi: [], kind: "context", tags: ["earth"], src: ["spinoff-tanks"], text: "Firefighter air tanks developed with Johnson Space Center weigh 20 lb for 30 minutes of air, 13 lb less than conventional tanks, at 4,500 psi (Spinoff, 1976)." },
  { id: "e03", psi: [], kind: "context", tags: ["earth"], src: ["spinoff-fires"], text: "Project FIRES used heat-protective materials from Apollo spacesuits and spacecraft to update firefighter gear (Spinoff, 1982)." },
  { id: "e04", psi: [], kind: "context", tags: ["earth", "suppression"], src: ["brief"], text: "Fine-water-mist extinguishers developed for the ISS have practical applications on Earth." },
  { id: "b01", psi: [], kind: "context", tags: ["moon", "atmosphere", "mars"], src: ["brief"], text: "Moon Base and pressurized rovers will likely use 30% O₂ or more at 10.2 psia or less: over 40% more oxygen than Earth air, making materials much more flammable. Spacesuits use 100% O₂ at 4.3 psi." },
  { id: "b02", psi: [], kind: "context", tags: ["moon", "mars", "gravity"], src: ["brief"], text: "There is currently no partial-gravity combustion data in PSI. Microgravity and normal-gravity results could bound what happens at intermediate gravity." }
];

        '<g class="hab" transform="translate(320 92) rotate(-6)"><rect x="-300" y="-3" width="600" height="6"/>' +
        [-270, -170, 170, 270].map(function (x) { return panel(x - 34, -78, 30, 70) + panel(x + 4, -78, 30, 70) + panel(x - 34, 8, 30, 70) + panel(x + 4, 8, 30, 70); }).join("") +
        '<rect x="-90" y="-12" width="180" height="24" rx="10"/><rect x="-14" y="-40" width="28" height="80" rx="10"/><rect x="90" y="-9" width="40" height="18" rx="8"/><rect x="-130" y="-9" width="40" height="18" rx="8"/>' +
        panel(-40, 40, 26, 50) + '<rect x="-60" y="-26" width="40" height="10" class="rad"/><rect x="20" y="-26" width="40" height="10" class="rad"/></g>';
    }
    var lift = id === "moon" || id === "rover" || id === "mars" ? '<g transform="translate(0 -30)">' + body + "</g>" : body;
    return starsSVG(id, id === "craft" || id === "iss") + '<svg class="scene s-' + id + '" viewBox="0 0 680 260" preserveAspectRatio="xMaxYMax meet" aria-hidden="true">' + DEFS + lift + "</svg>";
  }

  // ---------- shell ----------
  var NAV = [["summary", "Summary", "Özet"], ["evidence", "Evidence", "Kanıt"], ["model", "Model", "Model"], ["calibration", "Calibration", "Kalibrasyon"], ["scenarios", "Fire scenarios", "Yangın senaryoları"], ["custom", "Custom scenario", "Özel senaryo"], ["detection", "Smoke detection", "Duman tespiti"], ["findings", "Findings", "Bulgular"], ["sources", "Sources", "Kaynaklar"]];
  var NEXT = {
    summary: ["Start with the evidence: which NASA investigations matter for this habitat", "Kanıtla başlayın: bu habitat için hangi NASA deneyleri önemli"],
    evidence: ["How the evidence becomes a fire model", "Kanıt nasıl bir yangın modeline dönüşüyor"],
    model: ["Which model versions agree with NASA observations", "Hangi model sürümleri NASA gözlemleriyle uyuşuyor"],
    calibration: ["What the calibrated models predict for real fires", "Kalibre modeller gerçek yangınlar için ne öngörüyor"],
    scenarios: ["Test any cabin condition with the calibrated models", "Herhangi bir kabin koşulunu kalibre modellerle test edin"],
    custom: ["How early a fire can be detected from flight sensor data", "Uçuş sensör verisinden bir yangın ne kadar erken fark edilebilir"],
    detection: ["What all of this means for design and operations", "Bunların tasarım ve operasyon için anlamı"],
    findings: ["Sources, data checks and how each brief item is answered", "Kaynaklar, veri kontrolleri ve her brifing maddesinin karşılığı"]
  };
  function nextLink() {
    var i = NAV.map(function (n) { return n[0]; }).indexOf(C.page), n = NAV[i + 1]; if (!n || !NEXT[C.page]) return "";
    return '<nav class="nextp"><button data-p="' + n[0] + '"><span>' + L("Next", "Sonraki") + "</span><b>" + L(n[1], n[2]) + "</b><em>" + L(NEXT[C.page][0], NEXT[C.page][1]) + "</em></button></nav>";
  }
  var PAGES = { summary: pgSummary, findings: pgFindings, model: pgModel, calibration: pgCalibration, scenarios: pgScenarios, custom: pgCustom, detection: pgDetection, evidence: pgEvidence, sources: pgSources };
  function shell() {
    $("#nav").innerHTML = NAV.map(function (n, i) { return '<button data-p="' + n[0] + '"' + (C.page === n[0] ? ' class="on" aria-current="page"' : "") + '><i class="nn">' + (i + 1) + "</i>" + L(n[1], n[2]) + "</button>"; }).join("");
    $("#habs").innerHTML = '<span class="hl">' + L("Habitat", "Habitat") + "</span>" + HABS.map(function (h) { return '<button data-h="' + h.id + '"' + (C.hab === h.id ? ' class="on"' : "") + ">" + esc(hn(h)) + "</button>"; }).join("");
    var h = HB(), gl = h.g === 0 ? "0 g" : N(h.g, 2) + " g";
    $("#cond").innerHTML = [[L("Oxygen", "Oksijen"), PN(h.o2, h.o2 % 1 ? 1 : 0)], [L("Pressure", "Basınç"), N(h.p, 1) + " psia"], [L("Gravity", "Yerçekimi"), gl], [L("Module", "Modül"), N(h.V || 18) + " m³"]].map(function (c) { return "<div><span>" + c[0] + "</span><b>" + c[1] + "</b></div>"; }).join("");
    $("#lang").innerHTML = '<button data-lang="en"' + (LANG === "en" ? ' class="on"' : "") + '>English</button><button data-lang="tr"' + (LANG === "tr" ? ' class="on"' : "") + ">Türkçe</button>";
    var sk = document.getElementById("sky"); if (sk.getAttribute("data-k") !== C.hab) { sk.innerHTML = sceneSVG(C.hab); sk.setAttribute("data-k", C.hab); }
    document.documentElement.lang = LANG; document.documentElement.setAttribute("data-hab", C.hab);
    titles(document.querySelector(".top"));
  }
  function draw() {
    shell();
    var v = $("#view");
    v.innerHTML = '<p class="note">' + L("Computing the assessment…", "Değerlendirme hesaplanıyor…") + "</p>";
    setTimeout(function () {
      ensureCal();
      try { v.innerHTML = PAGES[C.page]() + nextLink(); if (C.page === "evidence") $("#mapc").innerHTML = mapSVG(); titles(v); }
      catch (err) { v.innerHTML = '<p class="note">' + esc(err.message) + "</p>"; }
    }, 20);
    $("#pop").hidden = true;
  }
  function go(p) { if (!PAGES[p]) return; C.page = p; try { history.replaceState(null, "", "#" + p); } catch (e) { } draw(); window.scrollTo(0, 0); }
  document.addEventListener("click", function (e) {
    var t = e.target.closest ? e.target : null; if (!t) return;
    var b;
    if ((b = t.closest("[data-lang]"))) { LANG = b.getAttribute("data-lang"); try { localStorage.setItem("ffa-lang", LANG); } catch (x) { } draw(); return; }
    if ((b = t.closest("[data-p]"))) { go(b.getAttribute("data-p")); return; }
    if ((b = t.closest("[data-go]"))) { go(b.getAttribute("data-go")); return; }
    if ((b = t.closest("[data-h]"))) { C.hab = b.getAttribute("data-h"); draw(); return; }
    if ((b = t.closest("[data-copy]"))) {
      var d = exportsData(b.getAttribute("data-copy")), box = $("#copybox");
      var done = function (ok) { $("#copied").textContent = ok ? L("Copied.", "Kopyalandı.") : L("Select the text below and copy it.", "Aşağıdaki metni seçip kopyalayın."); if (!ok) { box.hidden = false; box.value = d; box.focus(); box.select(); } };
      try { navigator.clipboard.writeText(d).then(function () { done(true); }, function () { done(false); }); } catch (x) { done(false); }
      return;
    }
    var pop = $("#pop");
    if ((b = t.closest("[data-ref]"))) {
      var ids = b.getAttribute("data-ref").split(","), html = ids.map(function (id) { var f = FIND_BY[id]; var ns = refNums([id]); return (f ? "<p>" + esc(f.text) + "</p>" : "") + ns.map(function (n) { var r = REFS[n - 1]; return '<p class="pr">[' + n + "] " + (r.url ? '<a href="' + r.url + '" target="_blank" rel="noopener">' + esc(r.t) + "</a>" : esc(r.t)) + (r.y ? ", " + r.y : "") + "</p>"; }).join(""); }).join("");
      pop.innerHTML = html + '<button class="x" aria-label="Close">×</button>'; pop.hidden = false;
      var rc = b.getBoundingClientRect(), w = Math.min(380, window.innerWidth - 24);
      pop.style.width = w + "px"; pop.style.left = Math.max(12, Math.min(window.innerWidth - w - 12, rc.left - 20)) + "px"; pop.style.top = (window.scrollY + rc.bottom + 6) + "px";
      return;
    }
    if (!pop.hidden && (!t.closest("#pop") || t.classList.contains("x"))) pop.hidden = true;
  });
  var start = (location.hash || "").slice(1); if (PAGES[start]) C.page = start;
  draw();
})();

</script>
</body></html>
